# AI4ACC 最小本体（MVP 版）
# 目的：验证「本体驱动归一化 + 分类推理」的效果
# 结构说明：
#   - classes/relations: 概念与关系（模式层，最小化）
#   - merchants: 商户实例（seed，来自真实账单高频商户）
#     - name: 实体规范名
#     - category: 关联分类（支持 父/子）
#     - aliases: 精确别名（账单字符串 == alias）
#     - keywords: 关键词包含匹配（账单字符串 contains keyword，门店变体用）
# 推理链：alias 精确命中 > keyword 包含命中 > category 继承

ontology:
  version: 0.1
  classes:
    商户:
      子类: [品牌商户, 门店商户, 组织, 个人]
    分类:
      餐饮: [咖啡, 快餐, 正餐, 零食饮料]
      交通: [地铁, 公交, 单车, 打车]
      日用百货: [超市]
      旅行: [酒店, 交通票务]
      通讯: []
      学习: []
      娱乐: [游戏]
      住房: []
  relations:
    - 交易 -发生于-> 商户
    - 交易 -属于-> 分类
    - 门店商户 -隶属品牌-> 品牌商户
    - 商户 -属于-> 分类

